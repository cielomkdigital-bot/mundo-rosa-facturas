<style>
:root{
  --ground:#FCF8F9; --panel:#FFFFFF; --edge:#EADDE2; --edge2:#F3E9ED;
  --ink:#1E141A; --ink2:#6B5560; --ink3:#9A8590;
  --rose:#B8235B; --rose-soft:#FBEAF0; --rose-ink:#FFFFFF;
  --ok:#1B6B45; --ok-bg:#E6F2EB;
  --warn:#9A5B06; --warn-bg:#FBEEDC;
  --bad:#A62B25; --bad-bg:#FAE7E5;
  --shadow:0 1px 2px rgba(60,20,40,.05),0 8px 24px -12px rgba(60,20,40,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#140F12; --panel:#1D171B; --edge:#33272E; --edge2:#261E23;
  --ink:#F5EDF0; --ink2:#B49FA9; --ink3:#7C6772;
  --rose:#FF87B0; --rose-soft:#33202A; --rose-ink:#1A0E14;
  --ok:#7FD3A6; --ok-bg:#172C22;
  --warn:#E8B667; --warn-bg:#2E2417;
  --bad:#F09A94; --bad-bg:#301C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#140F12; --panel:#1D171B; --edge:#33272E; --edge2:#261E23;
  --ink:#F5EDF0; --ink2:#B49FA9; --ink3:#7C6772;
  --rose:#FF87B0; --rose-soft:#33202A; --rose-ink:#1A0E14;
  --ok:#7FD3A6; --ok-bg:#172C22;
  --warn:#E8B667; --warn-bg:#2E2417;
  --bad:#F09A94; --bad-bg:#301C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding:36px 20px 90px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
h1{font-family:"Bricolage Grotesque","Public Sans",sans-serif;font-weight:700;font-size:clamp(28px,5vw,40px);
  line-height:1.05;margin:4px 0 0;letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--ink2);max-width:62ch;margin:6px 0 0}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20;
  background:var(--ground);padding:12px 0;border-bottom:1px solid var(--edge)}
.tab{font-family:"Public Sans",sans-serif;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:7px;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.grow{flex:1}
.search{font-family:inherit;font-size:13.5px;padding:8px 12px;border-radius:7px;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);min-width:190px}
.prog{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pbar{height:5px;background:var(--edge2);border-radius:3px;overflow:hidden;width:100%}
.pbar i{display:block;height:100%;background:var(--rose);transition:width .3s}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:14px 16px;
  box-shadow:var(--shadow);display:grid;gap:10px;
  grid-template-columns:26px minmax(0,1fr) auto;align-items:start}
.card.done{opacity:.55}
.card.done .nm{text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:10px}
.tick{width:22px;height:22px;margin:2px 0 0;accent-color:var(--rose);cursor:pointer}
.nm{font-weight:600;font-size:15.5px}
.fisc{font-size:13px;color:var(--ink2);margin-top:1px}
.fisc.otro{color:var(--warn);font-weight:500}
.meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);margin-top:3px}
.alert{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:5px 9px;border-radius:6px;
  margin-top:6px;max-width:52ch}
.acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink);text-decoration:none;display:inline-block;
  white-space:nowrap}
.btn:hover{border-color:var(--rose);color:var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.pri:hover{opacity:.88;color:var(--rose-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.amt{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;
  white-space:nowrap;text-align:right;min-width:88px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:6px;
  vertical-align:middle}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

.box{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:16px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:15px}
.box p{margin:0;font-size:13px;color:var(--ink2);max-width:70ch}
textarea{font-family:inherit;font-size:13.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--edge);
  background:var(--ground);color:var(--ink);width:100%;min-height:120px;resize:vertical;line-height:1.45}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{font-size:12px;color:var(--ok)}
.tot{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink2);
  border-top:1px solid var(--edge);padding-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{color:var(--ink3);font-size:13.5px;padding:24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--ground);
  padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);z-index:60;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){
  .card{grid-template-columns:26px minmax(0,1fr);}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .amt{text-align:left;min-width:0}
}

.chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{margin-left:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--edge);margin:9px 0 0 7px;display:block}
.box.aviso{border-color:var(--warn);border-left-width:4px}
.box.aviso h3{color:var(--warn)}
.nums{font-size:12.5px;color:var(--ink2);line-height:1.9;word-break:break-word}
.fixlist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);
  font-family:"IBM Plex Mono",monospace}
.fixlist b{color:var(--warn)}
</style>
</head>

<script>const D=JSON.parse(document.getElementById("app-data").textContent);const PEND=D.PEND,ENVI=D.ENVI,SIN=D.SIN;
const SELF = document.currentScript;
const CSS_ = document.querySelector('style').textContent;
const CODE_ = SELF.textContent;

const DEFAULT_MSG = "Hola! Te saludamos desde Mundo Rosa 🌸\nTe compartimos aquí tu factura por tu compra.\n¡Muchas gracias por la preferencia!";
const PASTE_CELL = 'A298';
const HOY = '28/08/2026';

let STATE;
try { STATE = JSON.parse(document.getElementById('app-state').textContent); } catch (e) { STATE = {}; }
if (!STATE || typeof STATE !== 'object') STATE = {};
if (!STATE.sent) STATE.sent = {};
if (typeof STATE.msg !== 'string') STATE.msg = DEFAULT_MSG;

let ART = null, LOCAL = false, TAB = 'pend', Q = '', SOLORUC = false, SOLOFALTA = false;

const $ = (s, r) => (r || document).querySelector(s);
const gs = n => (Number(n) || 0).toLocaleString('de-DE');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2400);
}

function buildDoc(state) {
  return '<!doctype html><html lang="es"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>Envío de Facturas Mundo Rosa</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">'
    + '<style>' + CSS_ + '</style></head><body>'
    + '<div class="wrap" id="app"></div><div class="toast" id="toast"></div>'
    + '<script id="app-state" type="application/json">' + JSON.stringify(state).replace(/<\//g, '<\\/') + '<\/script>'
    + '<script id="app-data" type="application/json">' + JSON.stringify({ PEND: PEND, ENVI: ENVI, SIN: SIN }).replace(/<\//g, '<\\/') + '<\/script>'
    + '<script>' + CODE_ + '<\/script></body></html>';
}

let saveTimer = null, dirty = false;
function save() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!dirty) return;
    dirty = false;
    try { localStorage.setItem('mr_state', JSON.stringify(STATE)); } catch (e) {}
    if (!ART) { if (LOCAL) toast('Guardado en este dispositivo'); return; }

    catch (e) { if (e && e.code === 'conflict') return; toast('No se pudo guardar en la nube'); }
  }, 900);
}

function waLink(r) {
  const msg = (STATE.msg || DEFAULT_MSG)
    .replace(/\{nombre\}/g, r.cliente || '')
    .replace(/\{monto\}/g, gs(r.monto))
    .replace(/\{factura\}/g, r.pdfnro || r.nro || '')
    .replace(/\{razon\}/g, r.razon || r.cliente || '')
    .replace(/\{link\}/g, r.pdf || '');
  return 'https://wa.me/595' + r.wsp + '?text=' + encodeURIComponent(msg);
}

function match(r) {
  if (!Q) return true;
  const q = Q.toLowerCase();
  return (r.cliente + ' ' + (r.razon || '') + ' ' + (r.ruc || '') + ' ' + (r.nro || '') + ' '
    + (r.pdfnro || '') + ' ' + (r.desc || '') + ' ' + (r.items || '')).toLowerCase().includes(q);
}

function tel(w) { return w ? '<a class="wa" href="https://wa.me/595' + w + '" target="_blank" rel="noopener">0' + w + '</a>' : '<span class="muted">sin WhatsApp</span>'; }

function cardPend(r) {
  const done = !!STATE.sent[r.id];
  const noContrib = /contribuyente/i.test(r.comp || '');
  const acts = [];
  if (r.pdf) acts.push('<a class="btn" href="' + r.pdf + '" target="_blank" rel="noopener">Abrir factura</a>');
  if (r.wsp) acts.push('<a class="btn pri" href="' + esc(waLink(r)) + '" target="_blank" rel="noopener" data-send="' + r.id + '">WhatsApp</a>');
  else acts.push('<span class="muted">sin WhatsApp</span>');
  return '<div class="card' + (done ? ' done' : '') + '">'
    + '<input type="checkbox" class="tick" data-id="' + r.id + '"' + (done ? ' checked' : '')
    + ' aria-label="Marcar como enviada la de ' + esc(r.cliente) + '">'
    + '<div><div class="nm">' + esc(r.cliente)
    + (noContrib ? '<span class="chip bad">no contribuyente</span>' : '') + '</div>'
    + (r.razon ? '<div class="fisc">' + esc(r.razon) + '</div>' : '')
    + '<div class="meta">' + (r.pdfnro ? 'N° ' + r.pdfnro + ' · ' : '') + esc(r.ruc || 'sin RUC')
    + ' · ' + esc(r.desc || 'Productos varios') + '</div>'
    + (r.nota ? '<div class="alert">' + esc(r.nota) + '</div>' : '')
    + '</div>'
    + '<div class="acts"><span class="amt">Gs. ' + gs(r.monto) + '</span>' + acts.join('') + '</div></div>';
}

function cardEnvi(r) {
  return '<div class="card">'
    + '<span class="dot" aria-hidden="true"></span>'
    + '<div><div class="nm">' + esc(r.cliente) + '</div>'
    + (r.razon ? '<div class="fisc">' + esc(r.razon) + '</div>' : '')
    + '<div class="meta">' + (r.pdfnro ? 'N° ' + r.pdfnro + ' · ' : '') + esc(r.ruc || 'sin RUC') + ' · ' + esc(r.fecha) + '</div></div>'
    + '<div class="acts"><span class="amt">Gs. ' + gs(r.monto) + '</span>'
    + (r.pdf ? '<a class="btn" href="' + r.pdf + '" target="_blank" rel="noopener">Ver PDF</a>' : '<span class="muted">sin PDF</span>')
    + (r.wsp ? '<a class="btn pri" href="' + esc(waLink(r)) + '" target="_blank" rel="noopener">WhatsApp</a>' : '')
    + '</div></div>';
}

function cardSin(r) {
  return '<div class="card">'
    + '<span class="dot" aria-hidden="true"></span>'
    + '<div><div class="nm">' + esc(r.cliente)
    + (r.ruc ? '' : '<span class="chip bad">falta RUC</span>')
    + (r.reciente ? '<span class="chip warn">reciente</span>' : '') + '</div>'
    + '<div class="fisc">' + esc(r.items || 'Productos varios') + '</div>'
    + '<div class="meta">' + (r.ruc ? esc(r.ruc) + ' · ' : '') + esc(r.origen) + ' fila ' + r.fila
    + (r.fecha ? ' · ' + esc(r.fecha) : '') + '</div></div>'
    + '<div class="acts"><span class="amt">Gs. ' + gs(r.monto) + '</span>' + tel(r.wsp) + '</div></div>';
}

function pendList() { return PEND.filter(r => !SOLOFALTA || !STATE.sent[r.id]).filter(match); }
function sinList() { return SIN.filter(r => !SOLORUC || r.ruc).filter(match); }

function tsvSin() {
  return sinList().map(r => ['POR EMITIR', HOY, 'Agosto', r.cliente, r.ruc, 'PYG',
    r.monto, r.items || 'Productos varios', '', '', 'HORIZON'].join('\t')).join('\n');
}

function render() {
  const app = $('#app');
  const done = PEND.filter(r => STATE.sent[r.id]).length;
  const pct = PEND.length ? Math.round(done / PEND.length * 100) : 0;
  const totPend = PEND.reduce((a, r) => a + (Number(r.monto) || 0), 0);
  const conPdf = PEND.filter(r => r.pdf).length;
  const errNro = PEND.concat(ENVI).filter(r => r.nota && /N°/.test(r.nota));
  const recientes = SIN.filter(r => r.reciente).length;
  const conRuc = SIN.filter(r => r.ruc).length;

  let body = '';
  if (TAB === 'pend') {
    const shown = pendList();
    body = '<div class="pbar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="box"><h3>' + done + ' de ' + PEND.length + ' enviadas</h3>'
      + '<p>La contadora ya emitió todo: ' + conPdf + ' facturas con PDF en Drive, por Gs. ' + gs(totPend) + '. '
      + 'Abrí la factura, descargala, tocá WhatsApp y adjuntala. El tilde se marca solo al tocar WhatsApp, '
      + 'y podés destildar si algo salió mal.</p>'
      + '<div class="row"><button class="btn" id="togglefalta" aria-pressed="' + SOLOFALTA + '">'
      + (SOLOFALTA ? 'Mostrar todas' : 'Solo las que faltan') + '</button>'
      + '<a class="btn" href="https://drive.google.com/drive/folders/1PJHbXOhk0Cb2R1C5EAOOQjL2brL-AV5l" target="_blank" rel="noopener">Abrir la carpeta</a></div></div>'
      + (errNro.length ? '<div class="box aviso"><h3>' + errNro.length + ' números mal cargados en la planilla</h3>'
        + '<p>En estos casos el número que figura en la planilla no es el de la factura real. Los botones de acá usan '
        + '<b>el PDF correcto</b>, identificado por la razón social, pero conviene corregir la planilla.</p>'
        + '<div class="fixlist">' + errNro.map(r => '<div>' + esc(r.cliente) + ' — planilla dice <b>'
        + r.nro + '</b>, la factura es la <b>' + r.pdfnro + '</b></div>').join('') + '</div></div>' : '')
      + '<div class="list">' + (shown.length ? shown.map(cardPend).join('') : '<div class="empty">Nada coincide.</div>') + '</div>'
      + '<div class="tot"><span>' + shown.length + ' en pantalla</span>'
      + '<span>Total a enviar: Gs. ' + gs(totPend) + '</span></div>'
      + '<div class="box"><h3>Mensaje de WhatsApp</h3>'
      + '<p>Se abre ya escrito en el chat, igual para todos. El PDF lo adjuntás vos. '
      + 'Si querés personalizarlo podés usar {nombre}, {monto}, {factura}, {razon} o {link}.</p>'
      + '<textarea id="msg">' + esc(STATE.msg) + '</textarea>'
      + '<div class="row"><button class="btn" id="msgreset">Volver al texto original</button>'
      + '<span class="hint">se guarda solo</span></div></div>';
  } else if (TAB === 'sin') {
    const shown = sinList();
    const totShown = shown.reduce((a, r) => a + (Number(r.monto) || 0), 0);
    body = '<div class="box"><h3>Pedidos que no están en la planilla de control</h3>'
      + '<p>' + SIN.length + ' pedidos de la planilla MR que no aparecen en el control. ' + recientes
      + ' son recientes y ' + conRuc + ' tienen RUC — el resto son viejos o sin RUC, que no se pueden facturar así. '
      + 'El botón copia lo que ves en pantalla, con las columnas en el orden de tu planilla; pegá en <b>' + PASTE_CELL + '</b>.</p>'
      + '<div class="row"><button class="btn pri" id="copysin">Copiar ' + shown.length + ' filas</button>'
      + '<button class="btn" id="toggleruc" aria-pressed="' + SOLORUC + '">' + (SOLORUC ? 'Mostrar todos' : 'Solo los que tienen RUC') + '</button>'
      + '<a class="btn" href="https://docs.google.com/spreadsheets/d/1TYuThr3yxTgcKlle3IpFlDTnmoe4Uu_g/edit" target="_blank" rel="noopener">Abrir la planilla</a></div></div>'
      + '<div class="list">' + (shown.length ? shown.map(cardSin).join('') : '<div class="empty">Nada coincide con el filtro.</div>') + '</div>'
      + '<div class="tot"><span>' + shown.length + ' de ' + SIN.length + ' en pantalla</span>'
      + '<span>Suma en pantalla: Gs. ' + gs(totShown) + '</span></div>';
  } else {
    const shown = ENVI.filter(match);
    const totEnv = ENVI.reduce((a, r) => a + (Number(r.monto) || 0), 0);
    body = '<div class="box"><h3>Historial</h3>'
      + '<p>Las ' + ENVI.length + ' facturas que la planilla marca como enviadas. Buscá por nombre, RUC o número para reenviar una.</p></div>'
      + '<div class="list">' + (shown.length ? shown.map(cardEnvi).join('') : '<div class="empty">Nada coincide con la búsqueda.</div>') + '</div>'
      + '<div class="tot"><span>' + shown.length + ' de ' + ENVI.length + ' en pantalla</span>'
      + '<span>Total facturado: Gs. ' + gs(totEnv) + '</span></div>';
  }

  app.innerHTML = '<div><div class="eyebrow">Mundo Rosa · datos al 28 de agosto de 2026</div>'
    + '<h1>Envío de facturas</h1>'
    + '<p class="lede">La contadora emitió las ' + PEND.length + ' facturas que faltaban y ya están en Drive. '
    + 'Quedan para mandar por WhatsApp.</p></div>'
    + '<div class="bar">'
    + '<button class="tab" data-tab="pend" aria-selected="' + (TAB === 'pend') + '">Para enviar · ' + (PEND.length - done) + '</button>'
    + '<button class="tab" data-tab="sin" aria-selected="' + (TAB === 'sin') + '">Sin cargar · ' + SIN.length + '</button>'
    + '<button class="tab" data-tab="env" aria-selected="' + (TAB === 'env') + '">Enviadas · ' + ENVI.length + '</button>'
    + '<span class="grow"></span>'
    + '<input class="search" id="q" type="search" placeholder="Buscar nombre, RUC o factura" value="' + esc(Q) + '">'
    + '<span class="prog">' + done + '/' + PEND.length + '</span>'
    + '</div>' + body;

  const q = $('#q');
  if (q && Q) { q.focus(); q.setSelectionRange(Q.length, Q.length); }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { TAB = tab.dataset.tab; render(); return; }
  if (e.target.id === 'toggleruc') { SOLORUC = !SOLORUC; render(); return; }
  if (e.target.id === 'togglefalta') { SOLOFALTA = !SOLOFALTA; render(); return; }
  if (e.target.id === 'msgreset') { STATE.msg = DEFAULT_MSG; save(); render(); toast('Mensaje restaurado'); return; }
  if (e.target.id === 'copysin') {
    navigator.clipboard.writeText(tsvSin())
      .then(() => toast('Filas copiadas — pegá en ' + PASTE_CELL))
      .catch(() => toast('No se pudo copiar'));
    return;
  }
  const send = e.target.closest('[data-send]');
  if (send) {
    const id = send.dataset.send;
    if (!STATE.sent[id]) { STATE.sent[id] = true; save(); setTimeout(render, 500); }
  }
});

document.addEventListener('change', e => {
  if (e.target.classList.contains('tick')) {
    const id = e.target.dataset.id;
    if (e.target.checked) STATE.sent[id] = true; else delete STATE.sent[id];
    save(); render();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { Q = e.target.value; render(); }
  if (e.target.id === 'msg') { STATE.msg = e.target.value; save(); }
});

render();

function fallbackLocal() {
  LOCAL = true;
  try {
    const l = JSON.parse(localStorage.getItem('mr_state') || 'null');
    if (l && l.sent) { STATE = Object.assign(STATE, l); render(); }
  } catch (e) {}
}
try {
  if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
    claude.use('artifact').then(a => { ART = a; if (!a) fallbackLocal(); }).catch(fallbackLocal);
  } else { fallbackLocal(); }
} catch (e) { fallbackLocal(); }
</script>
</body>
</html>
